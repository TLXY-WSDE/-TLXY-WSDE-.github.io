<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>送货员登录</title>
    <style>
        body{background:#f5f7fa; font-family:"微软雅黑";}
        .box{width:400px; margin:100px auto; background:white; padding:40px; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.1);}
        h2{text-align:center; margin-bottom:30px; color:#2ecc71;}
        input{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:6px; font-size:16px;}
        button{width:100%; padding:12px; background:#2ecc71; color:white; border:none; border-radius:6px; font-size:18px; margin-top:10px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>送货员登录</h2>
        <input type="text" placeholder="请输入用户名"><br>
        <input type="password" placeholder="请输入密码"><br>
        <button>登录</button>
    </div>
</body>
</html>
